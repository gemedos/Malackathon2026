name: Tests betsson.es

# Las listas de proveedor y juego se generan con scripts/update_catalog.py a partir del scrape de
# betsson.es (workflow "Actualizar catálogo"). GitHub no admite desplegables dinámicos ni dependientes:
# si eliges un juego, su proveedor es el que manda; si dejas "(todos...)", se prueban todos los
# juegos del proveedor elegido.
