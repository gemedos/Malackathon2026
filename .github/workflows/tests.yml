          - "Yggdrasil / Vikings Go To Vegas Wild Fight"
          - "Yggdrasil / Vikings Go Wild"
          - "Yggdrasil / Wild Joker Blitz"
          - "Yggdrasil / Your Own Island"
          # <<< catalog:games
  schedule:
    - cron: "0 6 * * 1-5"   # CLAUDE.md §9: ejecución programada con un único juego (vars.DEFAULT_GAME)

permissions:
  contents: read

# Una sola ejecución a la vez en todo el repo: todas usan la misma cuenta de dinero real.
concurrency:
  group: betsson-es-real-money
  cancel-in-progress: false

env:
  MARKET: es

defaults:
  run:
    shell: bash   # también en el runner self-hosted de Windows (Git Bash)

jobs:
  plan:
    name: Planificar juegos
    # Solo lee el catálogo del repo (no entra en betsson.es): puede correr en GitHub.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      provider: ${{ steps.plan.outputs.provider }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydantic PyYAML python-dotenv
      - name: Validar selección y repartir en lotes
        id: plan
        env:
          # Los inputs llegan por env (nunca interpolados en scripts) para evitar inyección.
          PROVIDER: ${{ inputs.provider || vars.DEFAULT_PROVIDER || 'Pragmatic Play' }}
          GAME: ${{ github.event_name == 'schedule' && (vars.DEFAULT_GAME || 'Pragmatic Play / Sweet Bonanza') || inputs.game }}
          CHUNK_SIZE: "20"
        run: python scripts/plan_games.py

  tests:
    name: Lote ${{ matrix.chunk }}
    needs: plan
    # betsson.es bloquea las IP fuera de España: corre en el runner self-hosted (PC en España)
    # registrado con la etiqueta betsson-es. Ver README, "Runner self-hosted".
    runs-on: [self-hosted, betsson-es]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1        # nunca dos sesiones a la vez con la misma cuenta
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PROVIDER: ${{ needs.plan.outputs.provider }}
      GAMES_JSON: ${{ toJSON(matrix.games) }}
      ACCOUNT: FUNDED
      BETSSON_ES_FUNDED_USER: ${{ secrets.BETSSON_ES_FUNDED_USER }}
      BETSSON_ES_FUNDED_PASS: ${{ secrets.BETSSON_ES_FUNDED_PASS }}
      BETSSON_ES_EMPTY_USER: ${{ secrets.BETSSON_ES_EMPTY_USER }}
      BETSSON_ES_EMPTY_PASS: ${{ secrets.BETSSON_ES_EMPTY_PASS }}
    steps:
      - name: Enmascarar usuarios
        run: |
          for v in "$BETSSON_ES_FUNDED_USER" "$BETSSON_ES_EMPTY_USER"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done

      - uses: actions/checkout@v4

      # El runner self-hosted conserva su carpeta de trabajo: los restos de otra ejecución
      # no deben mezclarse con las evidencias de esta.
      - name: Limpiar restos locales
        run: rm -rf artifacts .auth

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Todos los tests salvo el de higiene (los escenarios futuros se añadirán aquí solos).
      - name: Tests
        run: pytest tests --ignore=tests/test_secret_hygiene.py

      - name: Test de higiene de secretos
        id: hygiene
        if: always()
        run: pytest tests/test_secret_hygiene.py

      # Evidencias crudas para depurar (aún no se genera informe).
      # Solo se suben si la higiene pasó: nunca se publica un artifact con secretos.
      - name: Subir evidencias
        if: always() && steps.hygiene.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-${{ env.MARKET }}-${{ github.run_id }}-lote-${{ matrix.chunk }}
          path: |
            artifacts/
            !.auth/
            !**/.auth/**
          if-no-files-found: warn
          retention-days: 14

      - name: Borrar storage_state
        if: always()
        run: rm -rf .auth
