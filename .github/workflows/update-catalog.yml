name: Actualizar catálogo

# Hace scrape de betsson.es, actualiza config/catalog/es.json y los desplegables de tests.yml,
# y abre un PR con los cambios.
#
# GITHUB_TOKEN no puede modificar archivos de .github/workflows, así que hace falta el secreto
# CATALOG_PAT: un token fine-grained de este repo con permisos Contents, Pull requests y Workflows
# (lectura y escritura). Sin él, los archivos generados se suben como artifact para commitearlos a mano.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # lunes 05:00 UTC

permissions:
  contents: read

concurrency:
  group: update-catalog
  cancel-in-progress: true

env:
  MARKET: es

jobs:
  update:
    # Si betsson.es bloquea las IP de GitHub, cambia a: runs-on: self-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape y regenerar desplegables
        run: python scripts/update_catalog.py

      - name: ¿Hay cambios?
        id: diff
        run: |
          if git diff --quiet -- config/catalog .github/workflows/tests.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Catálogo sin cambios."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"; git diff --stat -- config/catalog .github/workflows/tests.yml
          fi

      - name: Subir archivos generados
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-${{ github.run_id }}
          path: |
            config/catalog/
            .github/workflows/tests.yml

      - name: Comprobar CATALOG_PAT
        if: steps.diff.outputs.changed == 'true'
        env:
          CATALOG_PAT: ${{ secrets.CATALOG_PAT }}
        run: |
          if [ -z "$CATALOG_PAT" ]; then
            echo "::error::Falta el secreto CATALOG_PAT (Contents + Pull requests + Workflows). Descarga el artifact 'catalogo-*' y commitéalo a mano."
            exit 1
          fi

      - name: Abrir PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CATALOG_PAT }}
          branch: chore/actualizar-catalogo
          commit-message: "Actualiza catálogo de proveedores y juegos de betsson.es"
          title: "Actualiza catálogo de proveedores y juegos de betsson.es"
          body: |
            Generado por el workflow **Actualizar catálogo** (`scripts/update_catalog.py`).
            Actualiza `config/catalog/es.json` y los desplegables de `.github/workflows/tests.yml`.
          add-paths: |
            config/catalog/es.json
            .github/workflows/tests.yml
