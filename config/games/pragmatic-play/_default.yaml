# Calibración del PROVEEDOR Pragmatic Play (sirve a todos sus juegos que no tengan YAML propio).
# Medida sobre Bubble Up (iframe 1280x720). Regiones [x, y, ancho, alto] normalizadas (0–1) respecto al iframe.
# Plantillas recortadas del mismo iframe: spin.png (botón en juego) y splash.png (Spin de la pantalla de carga).
# Si otro juego de Pragmatic tiene el HUD en otro sitio, copia este archivo a <juego-slug>.yaml y ajústalo.
provider: "Pragmatic Play"
game: "_default"
calibrated: true
reference_size: [1280, 720]
spin_template: spin.png
splash_template: splash.png
busy_template: null
template_threshold: 0.8
template_scales: [0.85, 1.0, 1.15, 1.3, 1.45]
regions:
  spin_search: [0.0, 0.0, 1.0, 1.0]
  reels:       [0.2578, 0.1319, 0.4883, 0.7153]
  balance:     [0.2328, 0.9, 0.1094, 0.0333]
  wager:       [0.2328, 0.9361, 0.1094, 0.0333]
  payout: [0.355, 0.875, 0.30, 0.0556]
  currency:    [0.25, 0.9361, 0.0547, 0.0333]
  # Solo el texto del aviso «MENSAJE» (sin título, botón ni rodillos: el diálogo es semitransparente y los símbolos
  # de alrededor rompían el OCR). Medido en Sweet Bonanza 2026-10-15: frase reconocida en 10/11 frames (antes 1/11).
  message:     [0.335, 0.36, 0.335, 0.14]
# Animación constante en los rodillos: el giro termina cuando el Spin vuelve a estar listo tras verse ocupado.
settle: ready
# Sin ganancia, la línea de premio muestra «¡HAGA SU APUESTA!» (sin dígitos) = premio 0,00.
# Separadores tolerantes: Tesseract 5.4 (Windows) lee los espacios de este texto como comillas («haga"su"apuesta»).
# Tras un giro perdido la línea alterna con «¡BUENA SUERTE!» (run 38768481527). Sin dígitos = premio 0,00.
idle_patterns: ["haga\\W*su\\W*apuest", "su\\W*apuest", "buena\\W*suerte"]
# Importes del HUD (crédito, apuesta, «GANANCIA x,xx €») en blanco puro sobre fondo rosa con brillos: se aísla solo ese
# texto antes del OCR. Medido sobre 91 recortes reales de Sweet Bonanza (2026-10-15): 21/21 saldos, 51/51 apuestas
# y 12/12 premios correctos, 0 erróneos (antes: «48,14» leído «4,14» y premios con ganancia ilegibles).
light_text: {max_saturation: 25, min_value: 235}
payout_empty_is_zero: false
setup_clicks: []
# Apuesta mínima (CLAUDE.md §3): el juego recuerda la última apuesta, así que se pulsa «−» hasta que la apuesta leída
# por OCR deja de bajar. Botón «−» del HUD estándar de Pragmatic, medido en Sweet Bonanza 2026-10-15.
# En la mínima, «−» abre el panel «MULTIPLICADOR DE APUESTA», que tapa el Spin: se cierra con su «×» (close_point),
# solo si el Spin no se ve (run 38766002917).
min_bet: {point: [0.695, 0.902], close_point: [0.874, 0.157], max_clicks: 30, settle_ms: 600}
insufficient_window_seconds: 5.0
motion: {start_threshold: 8.0, quiet_threshold: 2.0, quiet_seconds: 1.0, timeout_seconds: 25.0}
consensus: {min_readings: 3, min_separation_seconds: 0.3}
ready: {threshold: 0.8, busy_margin: 0.05}
