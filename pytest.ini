[pytest]
pythonpath = src vision-module
testpaths = tests
addopts = -ra -m "not real_money"
markers =
    real_money: juega con dinero real en betsson.es (solo con -m real_money)
    browser: abre Chromium en local sin tocar betsson.es
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(name)s: %(message)s
